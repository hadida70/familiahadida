services:
  app:
    image: node:22-alpine
    container_name: familiahadida-app
    restart: unless-stopped
    working_dir: /app
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=/app/data/database.sqlite
      - UPLOADS_DIR=/app/data/uploads
      - DB_FILE=/app/data/groceries_db.json
    volumes:
      - familiahadida_data:/app/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.familiahadida.rule=Host(`app.hadida.cloud`)"
      - "traefik.http.routers.familiahadida.entrypoints=websecure"
      - "traefik.http.routers.familiahadida.tls.certresolver=letsencrypt"
      - "traefik.http.services.familiahadida.loadbalancer.server.port=3000"
    command: >
      sh -c "
        apk add --no-cache git &&
        if [ ! -d /app/repo/.git ]; then
          git clone https://github.com/hadida70/familiahadida.git /app/repo
        else
          cd /app/repo && git fetch origin && git reset --hard origin/main
        fi &&
        cd /app/repo &&
        npm install &&
        npm run build &&
        node dist/server.cjs
      "

volumes:
  familiahadida_data:
